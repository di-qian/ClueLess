<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clue-Less Messaging Demo</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: 'Courier New', monospace;
        background-color: #f5f5f5;
        color: #333;
        margin: 0;
        padding: 5px;
        height: 100vh;
        overflow: hidden;
        font-size: 18px;
      }
      .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        background: #e0e0e0;
        padding: 8px;
        border: 1px solid #ccc;
        margin-bottom: 8px;
        text-align: center;
      }
      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        flex: 1;
        overflow: hidden;
      }
      .demo-section {
        background: white;
        border: 1px solid #ccc;
        padding: 8px;
        overflow-y: auto;
      }
      .message-log {
        background: #f9f9f9;
        border: 1px solid #ddd;
        height: 750px;
        overflow-y: scroll;
        padding: 5px;
        font-size: 16px;
      }
      .controls {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin: 4px 0;
      }
      button {
        padding: 8px 12px;
        background: #007cba;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #005a87;
      }
      input,
      select {
        padding: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
        margin: 3px;
      }
      h1 { 
        margin: 3px 0; 
        font-size: 26px; 
      }
      h2, h3 { 
        margin: 5px 0 3px 0; 
        font-size: 18px; 
      }
      h4 { 
        margin: 8px 0 3px 0; 
        font-size: 16px; 
        color: #666;
      }
      .message-item {
        border-bottom: 1px solid #eee;
        padding: 3px 0;
        font-size: 15px;
      }
      .timestamp {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>CLUE-LESS</h1>
      </div>

      <div class="main-content">
        <!-- Left Column -->
        <div class="demo-section">
          <h3>Connection & Player Management</h3>
          
          <h4>Connection Status</h4>
          <div id="connectionStatus">Disconnected</div>
          <div class="controls">
            <button onclick="connectToServer()">Connect</button>
            <button onclick="disconnectFromServer()">Disconnect</button>
          </div>
          
          <h4>Join Game</h4>
          <div>
            <input type="text" id="playerName" placeholder="Player Name" />
            <select id="characterSelect">
              <option value="">Select Character</option>
              <option value="Miss Scarlet">Miss Scarlet</option>
              <option value="Colonel Mustard">Colonel Mustard</option>
              <option value="Mrs. White">Mrs. White</option>
              <option value="Mr. Green">Mr. Green</option>
              <option value="Mrs. Peacock">Mrs. Peacock</option>
              <option value="Professor Plum">Professor Plum</option>
            </select>
            <button onclick="joinGame()">Join Game</button>
          </div>
        </div>

        <!-- Center Column -->
        <div class="demo-section">
          <h3>Game Actions & System Status</h3>
          
          <h4>Game Actions</h4>
          <div class="controls">
            <button onclick="sendGameAction('MAKE_MOVE')">Make Move</button>
            <button onclick="sendGameAction('MAKE_SUGGESTION')">Make Suggestion</button>
            <button onclick="sendGameAction('MAKE_ACCUSATION')">Make Accusation</button>
            <button onclick="requestGameState()">Get Game State</button>
          </div>
          
          <h4>System Status</h4>
          <div id="systemStatus">Not connected</div>
          <button onclick="fetchSystemStatus()">Fetch Status</button>
        </div>

        <!-- Right Column -->
        <div class="demo-section">
          <h3>Message Log</h3>
          <div class="message-log" id="messageLog"></div>
          <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>

    <script>
      let socket = null;
      let messageCount = 0;

      function logMessage(message, type = 'info') {
        messageCount++;
        const timestamp = new Date().toLocaleTimeString();
        const logDiv = document.getElementById('messageLog');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message-item';
        messageDiv.innerHTML = `
                <span class="timestamp">[${timestamp}] #${messageCount}</span>
                <strong>${type.toUpperCase()}:</strong> ${message}
            `;
        logDiv.appendChild(messageDiv);
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      function connectToServer() {
        if (socket) {
          logMessage('Already connected to server', 'warning');
          return;
        }

        logMessage('Attempting to connect to server...', 'system');
        socket = io('http://localhost:3001');

        socket.on('connect', () => {
          logMessage(
            '✅ Connected to server. Socket ID: ' + socket.id,
            'success'
          );
          document.getElementById(
            'connectionStatus'
          ).innerHTML = `<strong style="color: green;">Connected</strong><br>Socket ID: ${socket.id}`;
        });

        socket.on('disconnect', () => {
          logMessage('❌ Disconnected from server', 'error');
          document.getElementById('connectionStatus').innerHTML =
            '<strong style="color: red;">Disconnected</strong>';
        });

        // Listen for server messages
        socket.on('game_joined', (data) => {
          logMessage(
            `SERVER → CLIENT: Game joined successfully. ${data.gameState.playerCount} players in game`,
            'receive'
          );
        });

        socket.on('player_joined', (data) => {
          logMessage(
            `NETWORK → ALL_CLIENTS: Player ${data.player.name} joined as ${data.player.character}`,
            'broadcast'
          );
        });

        socket.on('action_processed', (data) => {
          logMessage(
            `SERVER → ALL_CLIENTS: Action ${data.action.type} processed for player ${data.playerId}`,
            'broadcast'
          );
        });

        socket.on('game_state_update', (data) => {
          logMessage(
            `SERVER → CLIENT: Game state updated. Phase: ${data.phase}, Players: ${data.playerCount}`,
            'receive'
          );
          displayGameState(data);
        });

        socket.on('player_left', (data) => {
          logMessage(
            `NETWORK → ALL_CLIENTS: Player ${data.playerId} left the game`,
            'broadcast'
          );
        });
      }

      function disconnectFromServer() {
        if (socket) {
          logMessage('Disconnecting from server...', 'system');
          socket.disconnect();
          socket = null;
        }
      }

      function joinGame() {
        if (!socket) {
          logMessage('❌ Not connected to server', 'error');
          return;
        }

        const name = document.getElementById('playerName').value;
        const character = document.getElementById('characterSelect').value;

        if (!name || !character) {
          logMessage('❌ Please enter name and select character', 'error');
          return;
        }

        const joinData = { name, character };
        logMessage(
          `CLIENT → NETWORK → SERVER: Sending JOIN_GAME message: ${JSON.stringify(
            joinData
          )}`,
          'send'
        );
        socket.emit('join_game', joinData);
      }

      function sendGameAction(actionType) {
        if (!socket) {
          logMessage('❌ Not connected to server', 'error');
          return;
        }

        const action = {
          type: actionType,
          timestamp: new Date().toISOString(),
          data: { demo: true },
        };

        logMessage(
          `CLIENT → NETWORK → SERVER: Sending GAME_ACTION: ${actionType}`,
          'send'
        );
        socket.emit('game_action', action);
      }

      function requestGameState() {
        if (!socket) {
          logMessage('❌ Not connected to server', 'error');
          return;
        }

        logMessage(
          'CLIENT → NETWORK → SERVER: Requesting game state',
          'send'
        );
        socket.emit('get_game_state');
      }

      function displayGameState(gameState) {
        document.getElementById('systemStatus').innerHTML = `
                <strong>Game ID:</strong> ${gameState.gameId}<br>
                <strong>Phase:</strong> ${gameState.phase}<br>
                <strong>Players:</strong> ${gameState.playerCount}<br>
                <strong>Recent Messages:</strong> ${gameState.messageLog.length}
            `;
      }

      async function fetchSystemStatus() {
        try {
          logMessage('Fetching system status via REST API...', 'system');
          const response = await fetch('http://localhost:3001/api/demo/status');
          const data = await response.json();

          logMessage('REST API Response: System status received', 'receive');
          document.getElementById('systemStatus').innerHTML = `
                    <strong>System:</strong> ${data.system}<br>
                    <strong>Architecture Components:</strong><br>
                    &nbsp;&nbsp;Server: ${data.architecture.server || 'ACTIVE'}<br>
                    &nbsp;&nbsp;Network Layer: ${
                      data.architecture.network || 'ACTIVE'
                    }<br>
                    &nbsp;&nbsp;Client Interface: ${
                      data.architecture.clientInterface || 'ACTIVE'
                    }<br>
                    <strong>Active Connections:</strong> ${
                      data.connectionStats.connectedClients
                    }<br>
                    <strong>Available Characters:</strong> ${data.availableCharacters.join(
                      ', '
                    )}
                `;
        } catch (error) {
          logMessage(
            '❌ Failed to fetch system status: ' + error.message,
            'error'
          );
        }
      }



      function clearLog() {
        document.getElementById('messageLog').innerHTML = '';
        messageCount = 0;
        logMessage('Message log cleared', 'system');
      }

      // Auto-connect on page load for demo
      window.addEventListener('load', () => {
        logMessage('Clue-Less Messaging Demo initialized', 'system');
        logMessage(
          'Click "Connect to Server" to begin demonstration',
          'system'
        );
      });
    </script>
  </body>
</html>
